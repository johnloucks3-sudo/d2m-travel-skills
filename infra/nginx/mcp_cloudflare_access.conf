# Thunderbird MCP Server — Cloudflare Access Zero Trust Policy
# Replaces basic-auth with Cloudflare Access service tokens + email-OTP
# Deploy via Cloudflare Zero Trust Dashboard (NOT nginx—this is the nginx result)
#
# Prerequisites:
# 1. mcp.d2mluxury.quest → Cloudflare tunnel active
# 2. Cloudflare Zero Trust → Access → Applications → Create "MCP Server"
# 3. Policy: Service Token (internal Wing) + Email-OTP (humans)
# 4. Store service token in .env: CF_ACCESS_SERVICE_TOKEN

server {
    listen 8770;
    listen [::]:8770;
    server_name mcp.d2mluxury.quest;

    # ════════════════════════════════════════════════════════════════════════
    # CLOUDFLARE ZERO TRUST ACCESS
    # ════════════════════════════════════════════════════════════════════════
    # Cloudflare Identity Validation:
    # - Cloudflare checks Authorization at the edge (before traffic reaches nginx)
    # - Nginx receives Cloudflare-signed JWT in CF-Authorization header
    # - Nginx validates and forwards to upstream MCP server
    #
    # Header flow:
    # Client → Cloudflare Access (auth gate) → Nginx (header validation) → MCP
    #
    # No basic-auth needed here — Cloudflare is the auth layer.

    # Validate Cloudflare JWT (if present)
    location / {
        # Check for Cloudflare Authorization header
        # If missing, Cloudflare should have blocked it before reaching nginx
        if ($http_cf_authorization = "") {
            return 403 "Cloudflare Authorization header missing — access denied by Zero Trust";
        }

        # Forward the MCP request to localhost:8765
        proxy_pass http://127.0.0.1:8765;

        # Proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve Cloudflare identity headers for audit/logging
        proxy_set_header CF-Access-Token-ID $http_cf_access_token_id;
        proxy_set_header CF-Access-Verified-Token $http_cf_access_verified_token;
        proxy_set_header CF-Authorization $http_cf_authorization;

        # Timeouts (allow long-running requests)
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 10;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Error handling
    error_page 403 /mcp_access_denied.html;
    location = /mcp_access_denied.html {
        internal;
        default_type text/html;
        return 403 "Access denied — failed Cloudflare Access verification. Check Zero Trust policy.";
    }

    # Access logs (include Cloudflare identity for audit)
    access_log /var/log/nginx/mcp_cloudflare_access.log combined;
    error_log /var/log/nginx/mcp_cloudflare_error.log warn;
}
