# Wing Roster Schema — MISSION-049
# Validation schema for wing_roster.yaml
---
schema_version: "1.0"
persona_fields:
  callsign:
    type: string | null
    description: "Operational callsign or null if none"
  full_name:
    type: string
    description: "Full name with rank and nickname"
  role:
    type: string
    description: "One-line role description"
  authority_level:
    type: integer
    min: 0
    max: 7
    description: "7=COS, 6=EXEC, 5=Department head, 4=Senior staff, 3=Specialist, 0=Decommissioned"
  trigger:
    type: string
    description: "When to invoke this persona"
  input_format:
    type: string | null
    description: "Expected input format when tasking this persona"
  output_format:
    type: string
    description: "Expected output format from this persona"
  client_facing:
    type: boolean
    description: "True if this persona communicates directly with clients"
  routing_notes:
    type: string
    description: "Routing constraints, triggers, and workflow relationships"
