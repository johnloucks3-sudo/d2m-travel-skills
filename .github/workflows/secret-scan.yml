name: Secret Scan — gitleaks + trufflehog
# MISSION-261 | A7 Sterling | 2026-06-16 (UPDATED 2026-06-18)
# Runs gitleaks and trufflehog on every push and pull_request to catch secrets before they land on remote.
# Companion to the pre-commit hook — this is the CI backstop.
#
# Secrets found = workflow FAILS (exit 1). Review the output, rotate the credential,
# remove it from history (BFG / git-filter-repo), then re-push.
#
# False positives:
#   - gitleaks: add an allow-list entry to .gitleaks.toml — NEVER suppress the whole scan.
#   - trufflehog: document the false positive in this file and add to its rules file if it exists.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — Detect hardcoded secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits in the push, not just HEAD.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for orgs; for personal repos it is not needed.
          # If this repo moves to an org, set the secret GITLEAKS_LICENSE in repo settings.
        # gitleaks-action reads .gitleaks.toml automatically if present.

  trufflehog:
    name: Trufflehog — Detect credential patterns
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --debug
