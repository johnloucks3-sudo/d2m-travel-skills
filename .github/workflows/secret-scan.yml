name: Secret Scan — gitleaks
# MISSION-261 | A7 Sterling | 2026-06-16
# Runs gitleaks on every push and pull_request to catch secrets before they land on remote.
# Companion to the pre-commit hook — this is the CI backstop.
#
# Secrets found = workflow FAILS (exit 1). Review the gitleaks output, rotate the credential,
# remove it from history (BFG / git-filter-repo), then re-push.
#
# False positives: add an allow-list entry to .gitleaks.toml — NEVER suppress the whole scan.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits in the push, not just HEAD.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for orgs; for personal repos it is not needed.
          # If this repo moves to an org, set the secret GITLEAKS_LICENSE in repo settings.
        # gitleaks-action reads .gitleaks.toml automatically if present.
