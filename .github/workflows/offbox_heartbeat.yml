name: Off-box Wing Heartbeat
# Off-box dead-man's switch (P2). Runs on GitHub's runners — external to Yoga —
# so it can detect total host/tunnel death that on-box monitoring cannot.
# Debounced (3 checks over ~1 min) to ignore transient blips. Pages Commander
# only on sustained unreachability = client-affecting.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wing (debounced) + alert on sustained failure
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          CHAT=7554895206
          URL=https://api.d2mluxury.quest/health
          alive=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$URL" || echo "000")
            # ANY HTTP response (incl 401/403) = host+tunnel up. 000 = unreachable.
            if [ "$code" != "000" ]; then alive=1; echo "check $i: HTTP $code (alive)"; break; fi
            echo "check $i: unreachable"; sleep 30
          done
          if [ "$alive" = "0" ]; then
            curl -s -m 20 "https://api.telegram.org/bot$BOT/sendMessage" \
              --data-urlencode "chat_id=$CHAT" \
              --data-urlencode "text=HEARTBEAT MISS — Thunderbird wing (api.d2mluxury.quest) unreachable after 3 checks/~1min. Yoga may be down. — off-box GitHub watcher" >/dev/null || true
            echo "ALERTED: sustained unreachable"; exit 1
          fi
          echo "wing alive"
