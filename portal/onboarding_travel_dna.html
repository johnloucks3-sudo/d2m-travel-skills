<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Travel DNA — Dreams2Memories</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #070c18;
            --bg-card: #0f1726;
            --gold: #c9a44e;
            --gold-bright: #e8c16a;
            --cream: #f5efe0;
            --text-muted: #7a8ba3;
            --selected-glow: rgba(201, 164, 78, 0.4);
        }

        body {
            background: var(--bg-deep);
            color: var(--cream);
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 60px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(74, 122, 191, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 164, 78, 0.04) 0%, transparent 50%);
        }

        .header {
            width: 100%;
            max-width: 760px;
            text-align: center;
            padding: 20px 0 8px;
        }

        .brand {
            font-size: 10px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px;
            font-family: 'Helvetica Neue', Helvetica, sans-serif;
        }

        /* Progress */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 18px 0 28px;
        }

        .progress-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(201, 164, 78, 0.15);
            border: 1px solid rgba(201, 164, 78, 0.25);
            transition: all 0.35s ease;
        }

        .progress-dot.active {
            background: var(--gold);
            box-shadow: 0 0 10px rgba(201, 164, 78, 0.5);
            transform: scale(1.2);
        }

        .progress-dot.done {
            background: rgba(201, 164, 78, 0.45);
            border-color: rgba(201, 164, 78, 0.45);
        }

        /* Screens */
        .screen {
            display: none;
            width: 100%;
            max-width: 760px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Intro */
        .intro-wrap {
            text-align: center;
            padding: 40px 0 20px;
        }

        .intro-eyebrow {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-family: 'Helvetica Neue', sans-serif;
            margin-bottom: 20px;
        }

        .intro-title {
            font-size: 36px;
            font-weight: normal;
            color: var(--cream);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            line-height: 1.25;
        }

        .intro-subtitle {
            font-size: 15px;
            color: rgba(245, 239, 224, 0.65);
            font-style: italic;
            margin-bottom: 36px;
            line-height: 1.75;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .intro-note {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Helvetica Neue', sans-serif;
            margin-bottom: 36px;
        }

        /* Category screen header */
        .screen-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .screen-number {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(201, 164, 78, 0.7);
            font-family: 'Helvetica Neue', sans-serif;
            margin-bottom: 10px;
        }

        .screen-title {
            font-size: 26px;
            font-weight: normal;
            color: var(--cream);
            margin-bottom: 5px;
        }

        .screen-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-style: italic;
        }

        .screen-hint {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(201, 164, 78, 0.5);
            font-family: 'Helvetica Neue', sans-serif;
            margin-top: 6px;
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .image-card {
            position: relative;
            border-radius: 7px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid rgba(201, 164, 78, 0.12);
            transition: all 0.22s ease;
            aspect-ratio: 3 / 2;
        }

        .image-card:hover {
            border-color: rgba(201, 164, 78, 0.45);
            transform: translateY(-2px);
        }

        .image-card.selected {
            border-color: var(--gold);
            box-shadow: 0 0 22px rgba(201, 164, 78, 0.35), 0 0 50px rgba(201, 164, 78, 0.12);
            transform: translateY(-2px);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.72) saturate(0.85);
            transition: filter 0.22s ease;
        }

        .image-card:hover img,
        .image-card.selected img {
            filter: brightness(0.82) saturate(0.95);
        }

        .image-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 22px 10px 9px;
            background: linear-gradient(transparent, rgba(7, 12, 24, 0.88));
            font-size: 12px;
            letter-spacing: 0.3px;
            color: var(--cream);
        }

        .image-card.selected .checkmark {
            display: grid;
        }

        .checkmark {
            display: none;
            position: absolute;
            top: 9px;
            right: 9px;
            width: 22px;
            height: 22px;
            background: var(--gold);
            border-radius: 50%;
            place-items: center;
            font-size: 11px;
            color: #070c18;
            font-family: 'Helvetica Neue', sans-serif;
            font-weight: 700;
        }

        .mood-badge {
            position: absolute;
            top: 7px;
            left: 7px;
            font-size: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Helvetica Neue', sans-serif;
            opacity: 0.75;
        }

        .mood-dreamy      { background: rgba(90,110,175,0.65); color: #c8d8ff; }
        .mood-romantic    { background: rgba(155,70,70,0.65); color: #ffd0d0; }
        .mood-inquisitive { background: rgba(60,130,90,0.65); color: #c0f0d0; }
        .mood-sharp       { background: rgba(90,90,90,0.65); color: #e8e8e8; }
        .mood-inspirational { background: rgba(170,130,50,0.65); color: #ffe0a0; }

        /* Buttons */
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 11px 30px;
            border: none;
            border-radius: 4px;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--gold);
            color: #070c18;
        }

        .btn-primary:hover:not(:disabled) { background: var(--gold-bright); }

        .btn-primary:disabled {
            background: rgba(201, 164, 78, 0.18);
            color: rgba(201, 164, 78, 0.35);
            cursor: not-allowed;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(122, 139, 163, 0.28);
        }

        .btn-ghost:hover {
            color: var(--cream);
            border-color: rgba(201, 164, 78, 0.35);
        }

        /* Results */
        #screen-results {
            text-align: center;
            padding: 10px 0;
            max-width: 600px;
            margin: 0 auto;
        }

        .result-prelude {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-family: 'Helvetica Neue', sans-serif;
            margin-bottom: 18px;
        }

        .result-archetype {
            font-size: 36px;
            font-weight: normal;
            color: var(--cream);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .result-divider {
            width: 56px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 18px auto;
        }

        .result-description {
            font-size: 15px;
            line-height: 1.85;
            color: rgba(245, 239, 224, 0.82);
            font-style: italic;
            margin-bottom: 20px;
        }

        .result-secondary {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.65;
            font-family: 'Helvetica Neue', sans-serif;
        }

        .result-selections {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
            margin-bottom: 32px;
        }

        .selection-chip {
            padding: 4px 11px;
            border: 1px solid rgba(201, 164, 78, 0.28);
            border-radius: 20px;
            font-size: 10px;
            color: rgba(201, 164, 78, 0.85);
            letter-spacing: 0.5px;
            font-family: 'Helvetica Neue', sans-serif;
        }

        /* Write-in section */
        .writein-section {
            margin: 0 0 22px;
            border-top: 1px solid rgba(201, 164, 78, 0.1);
            padding-top: 16px;
        }

        .writein-prompt {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(201, 164, 78, 0.55);
            font-family: 'Helvetica Neue', sans-serif;
            margin-bottom: 8px;
        }

        .writein-input {
            width: 100%;
            background: rgba(15, 23, 38, 0.7);
            border: 1px solid rgba(201, 164, 78, 0.15);
            border-radius: 5px;
            color: var(--cream);
            font-family: Georgia, serif;
            font-size: 13px;
            padding: 10px 12px;
            resize: none;
            outline: none;
            line-height: 1.6;
            transition: border-color 0.22s ease;
        }

        .writein-input::placeholder {
            color: rgba(122, 139, 163, 0.5);
            font-style: italic;
        }

        .writein-input:focus {
            border-color: rgba(201, 164, 78, 0.4);
        }

        /* Loading screen */
        .loading-wrap {
            text-align: center;
            padding: 80px 20px;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(201, 164, 78, 0.18);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 28px auto 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 540px) {
            .intro-title { font-size: 28px; }
            .result-archetype { font-size: 26px; }
            .screen-title { font-size: 22px; }
            .image-grid { gap: 7px; }
        }
    </style>
</head>

// ============================================================
// STATE
// selections[category] = array of { label, mood, key }
// writeins[category]   = free-text string (optional)
// ============================================================
let currentStep = -1;
let selections  = {};
let writeins    = {};

const DNA_API = 'https://api.d2mluxury.quest/api/travel-dna/interpret';

// ============================================================
// BUILD CATEGORY SCREENS (injected before results)
// ============================================================
function buildScreens() {
  const resultsEl = document.getElementById('screen-results');
  const body      = document.body;

  CATEGORIES.forEach((cat, i) => {
    const photos = PHOTOS[cat.key];
    const cardsHTML = photos.map((p, j) => `
      <div class="image-card" id="card-${i}-${j}"
           onclick="toggleImage(${i},${j},'${cat.key}','${p.label.replace(/'/g,"\\'")}','${p.mood}')">
        <img src="${p.img}" alt="${p.label}" loading="lazy" />
        <span class="mood-badge mood-${p.mood}">${p.mood}</span>
        <div class="image-label">${p.label}</div>
        <div class="checkmark">&#10003;</div>
      </div>`).join('');

    const div = document.createElement('div');
    div.className = 'screen';
    div.id = `screen-${i}`;
    div.innerHTML = `
      <div class="screen-header">
        <div class="screen-number">${i+1} of 8 &nbsp;&mdash;&nbsp; ${cat.title.toUpperCase()}</div>
        <div class="screen-title">${cat.title}</div>
        <div class="screen-subtitle">${cat.subtitle}</div>
        <div class="screen-hint">Select one or more</div>
      </div>
      <div class="image-grid">${cardsHTML}</div>
      <div class="writein-section">
        <div class="writein-prompt">Anything else that comes to mind?</div>
        <textarea class="writein-input" id="writein-${i}" rows="2"
          placeholder="Optional &mdash; a word or sentence about what matters to you here&hellip;"></textarea>
      </div>
      <div class="nav-row">
        ${i > 0 ? `<button class="btn btn-ghost" onclick="goBack(${i})">Back</button>` : ''}
        <button class="btn btn-primary" id="next-${i}" onclick="goNext(${i})" disabled>
          ${i === 7 ? 'See My Profile' : 'Next'}
        </button>
      </div>`;

    body.insertBefore(div, resultsEl);
  });
}

// ============================================================
// NAVIGATION
// ============================================================
function startTool() {
  document.getElementById('screen-intro').classList.remove('active');
  currentStep = 0;
  showScreen(0);
}

function showScreen(index) {
  document.querySelectorAll('.screen:not(#screen-intro):not(#screen-results)')
    .forEach(s => s.classList.remove('active'));

  for (let i = 0; i < 8; i++) {
    const d = document.getElementById(`dot-${i}`);
    d.classList.remove('active','done');
    if (i === index) d.classList.add('active');
    else if (i < index) d.classList.add('done');
  }

  const screen = document.getElementById(`screen-${index}`);
  screen.classList.add('active');

  // Restore prior multi-selections when back-navigating
  const cat = CATEGORIES[index];
  const saved = selections[cat.key] || [];
  const savedLabels = new Set(saved.map(s => s.label));
  PHOTOS[cat.key].forEach((p, j) => {
    const card = document.getElementById(`card-${index}-${j}`);
    if (savedLabels.has(p.label)) {
      card.classList.add('selected');
    } else {
      card.classList.remove('selected');
    }
  });
  document.getElementById(`next-${index}`).disabled = saved.length === 0;

  // Restore write-in text
  const ta = document.getElementById(`writein-${index}`);
  if (ta) ta.value = writeins[cat.key] || '';

  window.scrollTo(0, 0);
}

function toggleImage(si, ji, category, label, mood) {
  const card = document.getElementById(`card-${si}-${ji}`);
  const key  = `${category}::${label}`;

  if (!selections[category]) selections[category] = [];

  const existingIdx = selections[category].findIndex(s => s.key === key);
  if (existingIdx >= 0) {
    // Deselect
    selections[category].splice(existingIdx, 1);
    card.classList.remove('selected');
  } else {
    // Select
    selections[category].push({ label, mood, key });
    card.classList.add('selected');
  }

  document.getElementById(`next-${si}`).disabled = selections[category].length === 0;
}

function goNext(i) {
  // Capture write-in before leaving screen
  const ta = document.getElementById(`writein-${i}`);
  if (ta) writeins[CATEGORIES[i].key] = ta.value.trim();

  if (i === 7) { calculateResults(); }
  else { currentStep = i + 1; showScreen(currentStep); }
}

function showLoading() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('screen-loading').classList.add('active');
  window.scrollTo(0, 0);
}

function goBack(i) {
  currentStep = i - 1;
  showScreen(currentStep);
}

// ============================================================
// SCORING & RESULTS
// Image scores: each category contributes equal weight (normalized
// by number of selections within category).
// Write-in scores: AI interprets free text → additive adjustment.
// ============================================================
async function calculateResults() {
  const scores = { RE:0, AP:0, CC:0, LM:0, SA:0, CV:0, AF:0, SS:0 };

  // --- Image-based scoring ---
  Object.entries(selections).forEach(([cat, sels]) => {
    if (!sels || sels.length === 0) return;
    const catScores = { RE:0, AP:0, CC:0, LM:0, SA:0, CV:0, AF:0, SS:0 };
    sels.forEach(sel => {
      const w = WEIGHTS[sel.key];
      if (w) Object.entries(w).forEach(([k, v]) => { catScores[k] += v; });
    });
    const count = sels.length;
    Object.entries(catScores).forEach(([k, v]) => { scores[k] += v / count; });
  });

  // --- Show loading while AI interprets write-ins ---
  showLoading();

  // --- Write-in scoring via AI ---
  const activeWrites = {};
  Object.entries(writeins).forEach(([k, v]) => {
    if (v && v.trim()) activeWrites[k] = v.trim();
  });

  if (Object.keys(activeWrites).length > 0) {
    try {
      const resp = await fetch(DNA_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ writes: activeWrites }),
        signal: AbortSignal.timeout(12000)
      });
      if (resp.ok) {
        const data = await resp.json();
        if (data.adjustments) {
          Object.entries(data.adjustments).forEach(([k, v]) => {
            scores[k] = (scores[k] || 0) + Number(v);
          });
        }
      }
    } catch (e) {
      // API call failed — image scores still valid, proceed
      console.warn('Write-in interpretation unavailable:', e);
    }
  }

  const winner = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  showResults(ARCHETYPES[winner]);
}

function showResults(profile) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('progress-bar').style.display = 'none';

  document.getElementById('result-name').textContent        = profile.name;
  document.getElementById('result-description').textContent = profile.description;
  document.getElementById('result-secondary').textContent   = profile.secondary;

  // Flatten all selections across categories into chips
  const allSelections = Object.values(selections).flat();
  document.getElementById('result-selections').innerHTML =
    allSelections.map(s => `<span class="selection-chip">${s.label}</span>`).join('');

  document.getElementById('screen-results').classList.add('active');
  window.scrollTo(0, 0);
}

// ============================================================
// ACTIONS
// ============================================================
function sendToAdvisor() {
  const name = document.getElementById('result-name').textContent;
  const list = Object.entries(selections)
    .map(([cat, sels]) => `${cat.replace('_',' ')}: ${sels.map(s => s.label).join(', ')}`)
    .join('\n');

  const sub  = encodeURIComponent(`My Travel DNA: ${name}`);
  const body = encodeURIComponent(
    `Hi — I completed the Travel DNA profile on the Dreams2Memories site.\n\n` +
    `My archetype: ${name}\n\nMy selections:\n${list}\n\n` +
    `I'd love to learn more about what this means for planning my trip.`
  );
  window.location.href = `mailto:concierge@d2mluxury.quest?subject=${sub}&body=${body}`;
}

function restart() {
  selections = {};
  writeins   = {};
  document.querySelectorAll('.image-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.writein-input').forEach(ta => { ta.value = ''; });
  document.querySelectorAll('[id^="next-"]').forEach(b => { b.disabled = true; });
  document.getElementById('progress-bar').style.display = 'flex';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-intro').classList.add('active');
  currentStep = -1;
  window.scrollTo(0, 0);
}

// ============================================================
// INIT
// ============================================================
buildScreens();
</script>
