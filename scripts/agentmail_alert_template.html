<!--
D2M Rich Incident Alert Template — Bold Use #3 plumbing.
Gmail-safe: table-based layout, all CSS inline, no <style> blocks, no external assets.
USAFA colors per SO_EMAIL_RULES_UPDATE_20260530: cream #f7f3ea bg, blue #0000ff ink,
navy #003087 accent, Georgia font.

Placeholders (simple string .replace(), filled by
core/email/rich_incident_email.py:render_alert_html()):
  {{SEVERITY}}       - "P0" | "P1" | "P2" | "INFO"
  {{SEVERITY_COLOR}} - hex color for the badge, matched to severity
  {{SUBJECT}}        - one-line incident title
  {{TIMESTAMP}}      - ISO or human timestamp, MT
  {{SUMMARY}}        - 1-3 sentence prose summary
  {{DETAIL_ROWS}}    - pre-built <tr> HTML rows for the facts table (field/value pairs)
  {{LOG_EXCERPT}}    - raw log/diff/cert-detail text, HTML-escaped by the caller
-->
<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#f7f3ea; font-family:Georgia, 'Times New Roman', serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f3ea; padding:24px 0;">
<tr>
<td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border:1px solid #dcd6c7; border-radius:4px; overflow:hidden;">

<!-- Header bar with severity badge -->
<tr>
<td style="background-color:#003087; padding:16px 24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr>
<td style="font-family:Georgia, serif; color:#f7f3ea; font-size:14px; letter-spacing:1px;">
THUNDERBIRD WING &middot; INCIDENT ALERT
</td>
<td align="right">
<span style="display:inline-block; background-color:{{SEVERITY_COLOR}}; color:#ffffff; font-family:Georgia, serif; font-size:12px; font-weight:bold; padding:4px 10px; border-radius:3px;">{{SEVERITY}}</span>
</td>
</tr>
</table>
</td>
</tr>

<!-- Subject -->
<tr>
<td style="padding:24px 24px 8px 24px;">
<span style="font-family:Georgia, serif; color:#0000ff; font-size:20px; font-weight:bold;">{{SUBJECT}}</span>
</td>
</tr>

<!-- Timestamp -->
<tr>
<td style="padding:0 24px 16px 24px;">
<span style="font-family:Georgia, serif; color:#666666; font-size:12px;">{{TIMESTAMP}} MT</span>
</td>
</tr>

<!-- Summary -->
<tr>
<td style="padding:0 24px 20px 24px;">
<span style="font-family:Georgia, serif; color:#1a1a1a; font-size:15px; line-height:1.5;">{{SUMMARY}}</span>
</td>
</tr>

<!-- Facts table -->
<tr>
<td style="padding:0 24px 20px 24px;">
<table role="presentation" width="100%" cellpadding="8" cellspacing="0" style="border-collapse:collapse; border:1px solid #dcd6c7;">
{{DETAIL_ROWS}}
</table>
</td>
</tr>

<!-- Log excerpt / evidence block -->
<tr>
<td style="padding:0 24px 24px 24px;">
<div style="font-family:Georgia, serif; color:#003087; font-size:12px; font-weight:bold; margin-bottom:6px; letter-spacing:0.5px;">EVIDENCE</div>
<pre style="background-color:#f7f3ea; border:1px solid #dcd6c7; border-radius:3px; padding:12px; margin:0; font-family:'Courier New', monospace; font-size:12px; color:#1a1a1a; white-space:pre-wrap; word-break:break-word;">{{LOG_EXCERPT}}</pre>
</td>
</tr>

<!-- Footer -->
<tr>
<td style="background-color:#f7f3ea; border-top:1px solid #dcd6c7; padding:16px 24px;">
<span style="font-family:Georgia, serif; color:#666666; font-size:11px;">
Dreams2Memories Travel, LLC &middot; Thunderbird Wing automated alert &middot; hale-thunderbird@agentmail.to
</span>
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
