title: World Factbook — Client Destination Refresh
description: Weekly refresh of CIA World Factbook intel for all active client cruise destinations. Builds pre-trip briefing context.

prompt: |
  Call the get_country_intel MCP tool for each of the following active D2M client cruise destinations. Run each call and collect all results:
  - Norway
  - Iceland
  - Denmark
  - Finland
  - Japan
  - Hawaii
  - Greece

  Return the combined intelligence summary for all 7 destinations. This builds pre-trip briefing context for the active client roster.
