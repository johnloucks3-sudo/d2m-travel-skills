<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreams2Memories Travel — Get in Touch</title>
<style>
  :root{
    --cream:#f7f3ea; --ink:#0000ff; --navy:#003087; --paper:#fffdf8;
    --line:#d8cfba; --soft:#6b6253;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--cream); color:#22201b;
    font-family:Georgia,'Times New Roman',serif; line-height:1.55;
    padding:24px 16px;
  }
  .card{
    max-width:560px; margin:0 auto; background:var(--paper);
    border:1px solid var(--line); border-radius:14px;
    padding:28px 26px 32px; box-shadow:0 6px 24px rgba(0,0,0,.06);
  }
  .brand{color:var(--navy); font-size:1.7rem; margin:0 0 2px; letter-spacing:.3px}
  .tag{color:var(--soft); font-size:.95rem; margin:0 0 22px}
  .tabs{display:flex; gap:8px; margin-bottom:22px}
  .tab{
    flex:1; padding:10px; text-align:center; cursor:pointer;
    border:1px solid var(--line); border-radius:9px; background:#fff;
    color:var(--navy); font-size:1rem;
  }
  .tab.on{background:var(--navy); color:#fff; border-color:var(--navy)}
  label{display:block; font-size:.95rem; color:var(--navy); margin:14px 0 5px}
  input,textarea{
    width:100%; padding:11px 12px; font-family:inherit; font-size:1rem;
    border:1px solid var(--line); border-radius:9px; background:#fff;
  }
  textarea{min-height:120px; resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--ink); border-color:var(--ink)}
  button{
    margin-top:20px; width:100%; padding:13px; font-family:inherit;
    font-size:1.05rem; color:#fff; background:var(--ink); border:none;
    border-radius:10px; cursor:pointer;
  }
  button:hover{background:var(--navy)}
  button:disabled{opacity:.55; cursor:default}
  .msg{margin-top:18px; padding:14px 15px; border-radius:10px; font-size:.97rem; display:none}
  .msg.ok{display:block; background:#eef4ff; border:1px solid #bcd0ff; color:var(--navy)}
  .msg.err{display:block; background:#fdeeee; border:1px solid #f3c2c2; color:#8a1f1f}
  .ref{font-weight:bold; font-size:1.25rem; letter-spacing:1px}
  .hide{display:none}
  .foot{text-align:center; color:var(--soft); font-size:.82rem; margin-top:22px}
  .status-box{margin-top:18px}
  .status-line{padding:6px 0; border-bottom:1px solid var(--line)}
  .status-line b{color:var(--navy)}
</style>
</head>
<body>
  <div class="card">
    <h1 class="brand">Dreams2Memories Travel</h1>
    <p class="tag">Tell us what you need. We'll take it from here.</p>

    <div class="tabs">
      <div class="tab on" id="tab-submit" onclick="show('submit')">Send a Request</div>
      <div class="tab" id="tab-status" onclick="show('status')">Check Status</div>
    </div>

    <!-- SUBMIT -->
    <div id="panel-submit">
      <label for="name">Your name</label>
      <input id="name" autocomplete="name" placeholder="First and last">
      <label for="contact">Email or phone</label>
      <input id="contact" autocomplete="email" placeholder="So we can reach you">
      <label for="message">What can we help with?</label>
      <textarea id="message" placeholder="A trip you're dreaming about, a question, anything."></textarea>
      <button id="send" onclick="submitReq()">Send Request</button>
      <div class="msg" id="submit-msg"></div>
    </div>

    <!-- STATUS -->
    <div id="panel-status" class="hide">
      <label for="ref">Reference number</label>
      <input id="ref" placeholder="D2M-XXXX" style="text-transform:uppercase">
      <button id="check" onclick="checkStatus()">Check Status</button>
      <div class="msg" id="status-msg"></div>
      <div class="status-box hide" id="status-box">
        <div class="status-line"><b>Reference:</b> <span id="s-ref"></span></div>
        <div class="status-line"><b>Status:</b> <span id="s-status"></span></div>
        <div class="status-line"><b>Submitted:</b> <span id="s-when"></span></div>
        <div class="status-line hide" id="s-note-line"><b>Note:</b> <span id="s-note"></span></div>
      </div>
    </div>

    <div class="foot">Dreams2Memories Travel, LLC</div>
  </div>

<script>
function show(which){
  const sub = which === 'submit';
  document.getElementById('panel-submit').classList.toggle('hide', !sub);
  document.getElementById('panel-status').classList.toggle('hide', sub);
  document.getElementById('tab-submit').classList.toggle('on', sub);
  document.getElementById('tab-status').classList.toggle('on', !sub);
}
function setMsg(id, text, kind){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + kind;
}
async function submitReq(){
  const name = document.getElementById('name').value.trim();
  const contact = document.getElementById('contact').value.trim();
  const message = document.getElementById('message').value.trim();
  if(!name || !contact || !message){
    setMsg('submit-msg','Please fill in all three fields.','err'); return;
  }
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const r = await fetch('/api/request',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, contact, message})
    });
    const d = await r.json();
    if(r.ok){
      setMsg('submit-msg','', 'ok');
      document.getElementById('submit-msg').innerHTML =
        d.message + '<br><br>Your reference number: <span class="ref">'+d.ref+'</span>';
      document.getElementById('name').value='';
      document.getElementById('contact').value='';
      document.getElementById('message').value='';
    } else {
      setMsg('submit-msg', d.detail || 'Something went wrong. Please try again.', 'err');
    }
  } catch(e){
    setMsg('submit-msg','Could not reach the server. Please try again.','err');
  } finally {
    btn.disabled = false; btn.textContent = 'Send Request';
  }
}
async function checkStatus(){
  const ref = document.getElementById('ref').value.trim().toUpperCase();
  document.getElementById('status-box').classList.add('hide');
  if(!ref){ setMsg('status-msg','Enter your reference number.','err'); return; }
  try{
    const r = await fetch('/api/status/'+encodeURIComponent(ref));
    const d = await r.json();
    if(r.ok){
      setMsg('status-msg','','ok'); document.getElementById('status-msg').className='msg';
      document.getElementById('s-ref').textContent = d.ref;
      document.getElementById('s-status').textContent = d.status;
      document.getElementById('s-when').textContent = (d.submitted||'').replace('T',' ').slice(0,16);
      const noteLine = document.getElementById('s-note-line');
      if(d.note){ document.getElementById('s-note').textContent = d.note; noteLine.classList.remove('hide'); }
      else { noteLine.classList.add('hide'); }
      document.getElementById('status-box').classList.remove('hide');
    } else {
      setMsg('status-msg', d.detail || 'No request found for that reference number.','err');
    }
  } catch(e){
    setMsg('status-msg','Could not reach the server. Please try again.','err');
  }
}
</script>
</body>
</html>
