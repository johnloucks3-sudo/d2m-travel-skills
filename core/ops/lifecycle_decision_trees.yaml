          - persona: "a3"
            model: "sonnet"
            action: "present_to_client"
            note: "WF-17 applies"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
        client_facing: true
        cos_review: true
      b:
        label: "Dining Candidates (T-200d)"
        route:
          - persona: "a2"
            model: "haiku"
