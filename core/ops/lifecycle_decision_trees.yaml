          - persona: "a3"
            model: "sonnet"
            action: "present_candidates"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
        client_facing: true
        cos_review: false
      c:
        label: "Dining Confirmed"
        route:
          - persona: "a3"
            model: "sonnet"
            action: "confirm_to_client"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
        client_facing: true
        cos_review: true
      d:
        label: "30-Day Check-In"
        route:
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
