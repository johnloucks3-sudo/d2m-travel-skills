# Lifecycle ARC Decision Trees — MISSION-044
# Pre-decided routing for every Account Relationship Cycle touchpoint.
# Both HALE-OC and HALE-CC read this to auto-route.
# Schema: see lifecycle_router.py
# Aligned with Lifecycle Automation Compact v1.1 (MISSION-059)
# Naia (exec) inserted in every client-facing chain per SO 2026-05-13
---
version: "1.1"
last_updated: "2026-05-23"

# ── Default Rules ────────────────────────────────────────────────────────
defaults:
  research_lead: "a2"        # A2 Dembe owns all research
  finance_lead: "a9"         # A9 Harlan owns all pricing/finance
  client_voice: "a3"         # A3 Dani owns all client-facing output
  brand_pass: "exec"         # Naia owns brand gate on all client-facing output
  experience_lead: "a8"      # A8 Reyes owns experience mapping (post-A1)
  profile_lead: "a1"         # A1 Navarro owns intake profiling
  cos_gate: true             # All client products pass through COS before delivery
  commander_gate: true       # WF-17 send approval required for client output

# ── ARC Routing Rules ────────────────────────────────────────────────────
arc_routing:
  # Compact ARC0: Inbound inquiry / new lead
  arc0:
    label: "Inbound Inquiry / New Lead"
    system: "concierge_gate"
    description: "New lead via email, web form, or referral"
    positions:
      a:
        label: "Lead Intake"
        route:
          - persona: "a1"
            model: "sonnet"
            action: "initial_profile"
            note: "Raw inquiry text → inference profile with LOW confidence"
          - persona: "a8"
            model: "sonnet"
            action: "initial_recommendation"
            note: "Preliminary product match based on inferred profile"
          - persona: "cos"
            model: "sonnet"
            action: "gate_3_review"
            note: "Gate 3 — Commander first contact approval"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
            note: "Mandatory brand check before client-facing"
          - persona: "a3"
            model: "sonnet"
            action: "welcome_and_qualify"
            note: "Response to lead"
        client_facing: true
        cos_review: true

  # Compact ARC1: Trip selection / quote build (was arc1 Airfare+Hotel)
  arc1:
    label: "Trip Selection & Quote Build"
    system: "arc_price_dispatcher.py"
    description: "Flight + hotel search, pricing, and quote presentation"
    positions:
      a:
        label: "Research & Pricing (T-169d)"
        route:
          - persona: "a2"
            model: "sonnet"
            action: "research_destinations"
            note: "Gather flight routes, hotel options, seasonal pricing intel"
          - persona: "a8"
            model: "sonnet"
            action: "recommend"
            note: "Map to client Travel DNA — cabin/hotel tier preferences"
          - persona: "a9"
            model: "haiku"
            action: "validate_pricing"
            note: "Apply 25% markup, verify net rates"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "present_to_client"
        client_facing: true
        cos_review: true
      b:
        label: "Confirmed Booking"
        route:
          - persona: "a9"
            model: "haiku"
            action: "log_booking"
            note: "Record booking details, commission tracking"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "confirm_to_client"
            note: "Booking confirmation + next steps"
        client_facing: true
        cos_review: true
      c:
        label: "30-Day Check-In"
        route:
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "check_in"
            note: "Verify details, offer adjustments, remind of next ARC window"
        client_facing: true
        cos_review: false

  # Compact ARC2: Booking validation (post-deposit)
  arc2:
    label: "Booking Validation"
    system: "tess_webhook"
    description: "Post-deposit booking validation and welcome"
    positions:
      a:
        label: "Validation & Welcome (D+14)"
        route:
          - persona: "a1"
            model: "sonnet"
            action: "profile_refresh"
            note: "Update Travel DNA from booking data"
          - persona: "a3"
            model: "sonnet"
            action: "validation_email"
            note: "Booking confirmation, suite, FPD, next steps"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "cos"
            model: "sonnet"
            action: "wf17_gate"
            note: "WF-17 — Commander send approval"
        client_facing: true
        cos_review: true

  # Compact ARC3: Insurance window
  arc3:
    label: "Insurance Advisory"
    system: "manual"
    description: "Insurance window post-booking"
    positions:
      a:
        label: "Insurance Pitch (D+7-14)"
        route:
          - persona: "a3"
            model: "sonnet"
            action: "insurance_pitch"
            note: "Pre-existing window check — quote Allianz/TG/IMG"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "cos"
            model: "sonnet"
            action: "wf17_gate"
            note: "WF-17 — Commander send approval"
        client_facing: true
        cos_review: true

  # Compact ARC4: Air search window
  arc4:
    label: "Airfare Search"
    system: "arc_price_dispatcher.py, skiplagged_scraper, kayak_scraper"
    description: "Airfare research and booking"
    positions:
      a:
        label: "Air Search (T-330d to T-270d)"
        route:
          - persona: "a2"
            model: "sonnet"
            action: "route_intel"
            note: "Route options, fare classes, upgrade potential"
          - persona: "a8"
            model: "sonnet"
            action: "cabin_airline_fit"
            note: "Match airline/cabin to client profile"
          - persona: "a9"
            model: "haiku"
            action: "fare_check"
            note: "Current pricing, fare alerts"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "present_options"
        client_facing: true
        cos_review: true
      b:
        label: "Air Confirmed"
        route:
          - persona: "a9"
            model: "haiku"
            action: "log_booking"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "confirm_to_client"
        client_facing: true
        cos_review: true
      c:
        label: "30-Day Check-In"
        route:
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "check_in"
        client_facing: true
        cos_review: false

  # Compact ARC4-A: Specialty Dining (was arc4)
  arc5:
    label: "Specialty Dining"
    system: "manual (no scraper)"
    description: "Restaurant research, reservation tracking"
    positions:
      a:
        label: "Dining Preferences (T-216d)"
