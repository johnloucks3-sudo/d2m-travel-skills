      b:
        label: "Excursion Candidates"
        route:
          - persona: "a2"
            model: "sonnet"
            action: "deep_dive_candidates"
            note: "Detailed descriptions, duration, price, reviews"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "present_candidates"
        client_facing: true
        cos_review: false
      c:
        label: "Excursions Confirmed"
        route:
          - persona: "a9"
            model: "haiku"
            action: "log_booking"
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "confirm_to_client"
        client_facing: true
        cos_review: true
      d:
        label: "30-Day Check-In"
        route:
          - persona: "exec"
            model: "sonnet"
            action: "brand_pass"
          - persona: "a3"
            model: "sonnet"
            action: "check_in"
        client_facing: true
