# .gitleaks.toml — Thunderbird Wing
# MISSION-261 | A7 Sterling | 2026-06-16
#
# PHILOSOPHY: Allow-lists are NARROW and JUSTIFIED. Every entry here is a
# deliberate decision that a specific pattern is NOT a live secret.
# Adding an entry to silence a CI failure without rotating the credential is
# a process violation — flag to A7 Sterling for review.
#
# To add an entry: open a finding, state why it is a false positive, get A7 sign-off.
# Metric: allowlist entries <= 5. Currently: 4. Red threshold: >10.

title = "Thunderbird Wing — gitleaks config"

[extend]
# Use gitleaks default ruleset as the base. Extend, do not replace.
useDefault = true

[[allowlists]]
  description = "PKCE code_verifier in d2mc_pkce_verifier.json — one-time OAuth challenge value, not a persistent credential. Rotated per OAuth flow; value is mathematically derived from code_challenge (public)."
  paths = [
    '''config/d2mc_pkce_verifier\.json''',
  ]

[[allowlists]]
  description = "CIRPR-XXXXXXXX pattern in OpsCenter/collaboration/sterling_inbox.md — Wing-internal CI Probe Repair tracking IDs (CIR = CI Rapid Repair, PR = probe reference). Format: CIRPR-<hex8-12>. Not credentials. Pre-existing throughout file; false-positive on generic-api-key rule. Pending A7 Sterling sign-off (notified 2026-07-08 via sterling_inbox notification)."
  regexes = [
    '''CIRPR-[A-F0-9]{8,16}''',
  ]
  paths = [
    '''OpsCenter/collaboration/sterling_inbox\.md''',
  ]

[[allowlists]]
  description = "deploy/searxng/settings.yml — SearXNG server HMAC session-signing key. Internal search UI only; not a credential for any external service. Cannot be moved to env var without breaking the Docker YAML loader. Key rotated 2026-07-10 (old value never pushed to GitHub — origin froze 2026-06-12). Accept-risk per SO_CI_RAZOR_SHARP_20260620 Hale CI authority."
  paths = [
    '''deploy/searxng/settings\.yml''',
  ]

[[allowlists]]
  description = "validations/lyons_regent/ — scraped HTML captures from rssc.com (Regent portal) for the Lyons client scrape. Findings (iperceptionskey, BOOMR_API_key, mapObjectAccessToken) are third-party analytics/RUM/mapping SDK keys embedded by Regent in their own web pages — not D2M credentials. Files untracked from git 2026-07-10 and added to .gitignore; allowlist covers historical commit 573a6ed (2026-07-03) where they landed. A7 Sterling CI remediation sign-off: Hale CI authority per SO_CI_RAZOR_SHARP_20260620.md."
  paths = [
    '''validations/lyons_regent/''',
  ]

[[allowlists]]
  description = "Historical findings in commit 0d3af2a4b (2026-07-28): (1) Pexels API key hardcoded as default in image_selector_cli.py and core/media/validator.py — both fixed in working tree 2026-07-29 (removed default value, key must come from PEXELS_API_KEY env var); (2) SSH private key (zfold-termius-rotated-20260712, ED25519) in intel/email_forward_1783873952.txt — key rotation notification email saved as intel archive, cannot edit archived email content. Pexels key is free-tier, recommend rotation at pexels.com. SSH key: recommend rotation if still active. Hale CI authority, SO_CI_RAZOR_SHARP_20260620. Allowlist entry count: 5."
  commits = ["0d3af2a4b50684ba7cea41df41bffb6c6441fc5a"]

