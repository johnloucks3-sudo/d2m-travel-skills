# STAGED, NOT YET APPLIED — see docs/superpowers/specs/
# 2026-07-09-self-healing-architecture-reverse-engineered.md, "Long-Tail
# Remediation Adoption" section, for the one outstanding cross-check
# (Whetstone: confirm no double-remediation conflict with any Lane 1
# CI-registered skill that also maps to a systemd unit a repair() body
# restarts directly) before this goes live fleet-wide.
#
# TO APPLY (after the cross-check above):
#   cp config/staged/onfailure-remediate.conf ~/.config/systemd/user/service.d/onfailure-remediate.conf
#   systemctl --user daemon-reload
#
# This is a systemd "drop-in for a unit TYPE" — placing this at
# ~/.config/systemd/user/service.d/<name>.conf applies it to every
# .service unit the user systemd instance manages, with ZERO per-unit
# editing (the "zero-config, zero-new-deps" property that made this the
# adopted candidate over Monit/Sensu/StackStorm/Event-Driven Ansible).
#
# thunderbird-generic-remediate@.service (already installed + empirically
# verified against a real disposable canary unit, both fail and recovery
# paths, 2026-07-09) is the dispatch target. %N = the failed unit's base
# name (without its own .service suffix) — using %n here would double the
# suffix (verified/caught during canary testing).
[Unit]
OnFailure=thunderbird-generic-remediate@%N.service
