# Per-unit memory limit for the continuity executor (A7 Sterling, 2026-07-16).
# Steady-state RSS is ~4MB, but it spawns detached headless-Claude trees that
# (start_new_session=True does NOT leave the cgroup) count against THIS cgroup.
# The in-flight guard in continuity_executor.py now caps concurrency to one live
# spawn per alert; this hard ceiling is the safety net that keeps a regression
# from ever taking the box down via swap again. MemoryHigh throttles before the kill.
# Lives here (per-unit), NOT in service.d/ — see 00-thunderbird-default-memory.conf.
[Service]
MemoryMax=1610612736
MemoryHigh=1342177280
