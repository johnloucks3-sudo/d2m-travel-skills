# Per-unit memory limit (moved out of shared service.d/ 2026-07-16, A7 Sterling).
# MUST live here, NOT in service.d/: top-level service.d/ drop-ins apply to EVERY
# unit and the lexically-last basename wins, silently capping all services.
# override.conf sorts after 00-thunderbird-default-memory.conf so this wins for THIS unit only.
[Service]
MemoryMax=2147483648
MemoryHigh=1610612736
