# FLEET-WIDE DEFAULT memory limit — applies to EVERY user .service unit.
#
# WHY the "00-" prefix (A7 Sterling, 2026-07-16 — load-bearing, do not rename):
#   This is a top-level "drop-in for a unit TYPE" (service.d/, not <unit>.service.d/),
#   so it applies to ALL service units. systemd on this host merges ALL drop-ins
#   (top-level AND per-unit) sorted by BASENAME across directories, last-basename
#   wins for single-value keys like MemoryMax. Per-unit dir does NOT grant precedence
#   (verified empirically 2026-07-16: a per-unit override.conf lost to a "thunderbird-*"
#   top-level conf).
#
#   Therefore this default MUST sort FIRST so per-unit overrides beat it. The "00-"
#   prefix guarantees that. Its prior name "thunderbird-default-memory.conf" sorted
#   LAST and silently clobbered every per-service limit (qdrant 4G, opencode 2G, etc.
#   were all capped to this 1G). That was the fleet-wide OOM root cause.
#
# TO GIVE A SERVICE A DIFFERENT LIMIT: create
#   ~/.config/systemd/user/<unit>.service.d/override.conf  (NOT here in service.d/)
#   with [Service]\nMemoryMax=... . "override.conf" sorts after "00-*" so it wins for
#   that unit only. Do NOT drop service-specific *.conf files in this service.d/ dir —
#   they apply to every unit and the lexically-last one clobbers all others.
[Service]
MemoryMax=1073741824
MemoryHigh=805306368
